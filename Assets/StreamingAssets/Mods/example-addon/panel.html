<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #12141a;
    color: #e8eaf0;
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { padding: 18px 20px; }
  h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; color: #9fe1cb; }
  p { margin: 0 0 12px; color: #b4b2a9; }
  code { color: #f0b47b; font-family: Consolas, monospace; }
  .box {
    margin-top: 14px;
    padding: 12px 14px;
    border: 1px solid #2c2c2a;
    border-radius: 10px;
    background: #1a1c22;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>示例插件</h1>
    <p>这个面板完全由 <code>Mod.xml</code> 声明，没有编译任何 C# 代码。</p>
    <div class="box">
      <p style="margin:0">想加代码的话，在清单里写：</p>
      <p style="margin:8px 0 0"><code>&lt;EntryPoint type="你的命名空间.入口类" /&gt;</code></p>
      <p style="margin:6px 0 0"><code>&lt;Assemblies&gt;&lt;Assembly path="你的.dll" /&gt;&lt;/Assemblies&gt;</code></p>
    </div>
  </div>
</body>
</html>
